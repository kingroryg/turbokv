[package]
name = "turbokv"
version = "0.5.0"
authors = ["kingroryg"]
edition = "2021"
rust-version = "1.80.0"
license = "Apache-2.0"
repository = "https://github.com/kingroryg/turbokv"
homepage = "https://github.com/kingroryg/turbokv"
documentation = "https://docs.rs/turbokv"
readme = "README.md"
description = "A fast, embedded key-value store with BTreeMap-like API."
keywords = ["database", "kv", "lsm", "storage", "key-value"]
categories = ["database-implementations", "data-structures"]
include = ["src/**/*", "examples/**/*", "Cargo.toml", "CHANGELOG.md", "LICENSE.md", "README.md"]

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["fs", "io-util", "sync", "rt-multi-thread", "macros", "time"] }

# Error handling
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"

# Bytes and I/O
bytes = "1.7"
byteorder = "1.5"
memmap2 = "0.9"

# Data integrity
crc32fast = "1.4"

# Concurrent data structures
crossbeam-skiplist = "0.1"
parking_lot = "0.12"

# Compression
zstd = "0.13"
snap = "1.1"
lz4_flex = "0.11"

# Utilities
tracing = "0.1"
libc = "0.2"
lru = "0.12"
num_cpus = "1.16"
gxhash = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.10"
proptest = "=1.5.0"
rand = "0.8"
tokio = { version = "1.40", features = ["full", "test-util"] }

[lints.rust]
# Unsafe is limited to mmap and platform filesystem/FD system calls.
unsafe_code = "allow"
missing_docs = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
derivable_impls = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
uninlined_format_args = "allow"
too_many_lines = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
# Additional allows for existing code patterns
redundant_closure_for_method_calls = "allow"
unused_async = "allow"
doc_markdown = "allow"
match_same_arms = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
if_not_else = "allow"
items_after_statements = "allow"
needless_pass_by_value = "allow"
redundant_else = "allow"
single_match_else = "allow"
unnecessary_wraps = "allow"
used_underscore_binding = "allow"
manual_let_else = "allow"
unused_self = "allow"
map_unwrap_or = "allow"
use_debug = "allow"
ref_as_ptr = "allow"
manual_div_ceil = "allow"
new_without_default = "allow"
wildcard_imports = "allow"
question_mark = "allow"
needless_continue = "allow"
needless_for_each = "allow"
explicit_iter_loop = "allow"
needless_lifetimes = "allow"
return_self_not_must_use = "allow"
wrong_self_convention = "allow"
create_dir = "allow"
case_sensitive_file_extension_comparisons = "allow"
elidable_lifetime_names = "allow"
iter_without_into_iter = "allow"
lines_filter_map_ok = "allow"
needless_borrow = "allow"
unnecessary_cast = "allow"
unnecessary_debug_formatting = "allow"
cast_possible_wrap = "allow"
doc_lazy_continuation = "allow"
manual_is_power_of_two = "allow"
needless_range_loop = "allow"
should_implement_trait = "allow"
suspicious_open_options = "allow"
default_trait_access = "allow"
ptr_arg = "allow"
borrow_deref_ref = "allow"
unreadable_literal = "allow"
unwrap_used = "allow"
unnecessary_literal_unwrap = "allow"
unchecked_duration_subtraction = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = true

[profile.bench]
inherits = "release"
debug = true

[[bench]]
name = "paranoid_group_commit"
path = "benchmarks/paranoid_group_commit.rs"
harness = false

[[test]]
name = "benchmark_protocol"
path = "benchmarks/protocol_tests.rs"

# Run example main functions as part of `cargo test --examples`.
[[example]]
name = "basic"
test = true
harness = false

[[example]]
name = "batch_writes"
test = true
harness = false

[[example]]
name = "concurrent"
test = true
harness = false

[[example]]
name = "configuration"
test = true
harness = false

[[example]]
name = "persistence"
test = true
harness = false

[[example]]
name = "range_queries"
test = true
harness = false
