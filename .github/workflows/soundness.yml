name: soundness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miri:
    name: Miri (portable retained unsafe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Miri
        run: rustup toolchain install nightly --profile minimal --component miri
      # Miri does not emulate TurboKV's mmap, flock, or platform direct-I/O
      # syscalls. Exercise the portable allocation/pointer unsafe here; the
      # native syscall and mmap paths are covered by the sanitizer jobs below.
      - name: Check aligned allocation, growth, copy, reuse, and drop
        env:
          # gxhash is compiled but not executed by this filtered Miri test.
          RUSTFLAGS: -C target-feature=+aes,+sse2
        run: >-
          cargo +nightly miri test --lib
          storage::direct_io::tests::retained_unsafe_aligned_buffer_survives_empty_growth_reuse_and_cross_thread_drop
          -- --exact

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AddressSanitizer (native memory)
            sanitizer: address
            test: seeded_whole_database_operations_match_ordered_model
          - name: ThreadSanitizer (concurrency)
            sanitizer: thread
            test: sqlite_wal_reset_inspired_rotation_checkpoint_reclamation_interleaving_is_sound
    steps:
      - uses: actions/checkout@v4
      - name: Install sanitizer toolchain
        run: rustup toolchain install nightly --profile minimal --component rust-src
      # Rust's native sanitizers are currently supported by this gate on
      # x86_64 Linux. Building std with the same instrumentation avoids gaps at
      # the runtime boundary and keeps unsupported host targets out of CI.
      - name: Run ${{ matrix.sanitizer }} sanitizer
        env:
          RUSTFLAGS: -C target-cpu=native -Zsanitizer=${{ matrix.sanitizer }}
        run: >-
          cargo +nightly test -Zbuild-std
          --target x86_64-unknown-linux-gnu
          --test database_soundness
          ${{ matrix.test }}
          -- --exact --nocapture
      - name: Check persisted Bloom hash mapping under AddressSanitizer
        if: matrix.sanitizer == 'address'
        env:
          RUSTFLAGS: -C target-cpu=native -Zsanitizer=address
        run: >-
          cargo +nightly test -Zbuild-std
          --target x86_64-unknown-linux-gnu
          --lib storage::sstable::bloom::tests::fixed_hash_and_bit_vectors_cover_padded_and_direct_paths
          -- --exact --nocapture
      - name: Check released SSTable fixture identity and reads under AddressSanitizer
        if: matrix.sanitizer == 'address'
        env:
          RUSTFLAGS: -C target-cpu=native -Zsanitizer=address
        run: >-
          cargo +nightly test -Zbuild-std
          --target x86_64-unknown-linux-gnu
          --test format_compatibility released_
          -- --nocapture
