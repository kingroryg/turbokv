[package]
name = "turbokv-benchmarks"
version = "0.1.0"
edition = "2021"
publish = false
autobenches = false

[workspace]

[dependencies]
fjall = "=2.11.2"
rocksdb = { version = "=0.22.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.148"
tempfile = "=3.24.0"
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread", "time"] }
turbokv = { path = "..", version = "=0.5.0" }

[[bench]]
name = "benchmarks"
path = "main.rs"
harness = false

[[test]]
name = "benchmark_protocol"
path = "protocol_tests.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"
struct_excessive_bools = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unnecessary_wraps = "allow"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
